name: Build MyPet

on:
  push:
    branches: [master, development]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Spigot 26.3 class files target Java 25 (class version 69); javac must be JDK 25+ to read them.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -ntp clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: MyPet-jar
          path: target/MyPet-*.jar
          if-no-files-found: error
